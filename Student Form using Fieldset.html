<!DOCTYPE html>
<html>
  <head>
    <title>Application Form</title>
    <style>
      body {
        max-width: 700px;
        max-height: 80%;
      }
    </style>
  </head>
  <body>
    <h1><center>Student Application Form</center></h1>

    <form>
      <fieldset>
        <legend><h2>Personal Details :</h2></legend>
        <h4>

        <label for="name">Student Name:</label>
        <input type="text" id="name" name="name" maxlength="25" size="35" /><br /><br />

        <label for="fname">Father's Name:</label>
        <input type="text" id="fname" name="fname" maxlength="25" size="35" /><br /><br />

        <label for="mname">Mother's Name:</label>
        <input type="text" id="mname" name="mname" maxlength="25" size="35" /><br /><br />

        <label for="dob">Date of Birth:</label>
        <input type="date" id="dob" name="dob" required size="35" /><br /><br />

        <label for="contact">Contact Number:</label>
        <input type="tel" id="contact" name="contact" maxlength="10" size="15" /><br /><br />

        <label for="email">Email ID:</label>
        <input type="email" id="email" name="email" maxlength="25" required size="30" /><br /><br />

        <label for="gender">Gender:</label>
        <input type="radio" name="gender" value="Male" />Male 
        <input type="radio" name="gender" value="Female" />Female
        <input type="radio" name="gender" value="Other" />Other<br /><br />

        <label for="address">ADDRESS :</label><br />
        <textarea id="address" name="address" rows="4" cols="48"></textarea><br /><br /></h4>
      </fieldset>

      <fieldset>
        <legend><h2>Educational Information :</h2></legend>
        <h4>

        <label for="highschool">High School Name:</label>
        <input type="text" id="highschool" name="highschool" maxlength="25" required size="35" /><br /><br />

        <label for="percentage">Percentage:</label>
        <input type="text" id="percentage" name="percentage" required size="10" /><br /><br />

        <label for="year">Year of completion:</label>
        <input type="text" id="year" name="year" size="10" /><br /><br /><br>

        <label for="puc">Pre-University Name:</label>
        <input type="text" id="puc" name="puc" maxlength="25" required size="35" /><br /><br />

        <label for="year">Year of completion:</label>
        <input type="text" id="year" name="year" size="10" /><br /><br />

        <label for="stream">Course optd in PUC:</label>
        <select id="stream" name="stream">
          <option value="">--Select--</option>
          <option value="science">Science</option>
          <option value="commerce">Commerce</option>
          <option value="arts">Arts</option>
        </select><br /><br /></h4>
      </fieldset>

      <fieldset>
        <legend><h2>DOCUMENTS :</h2></legend>
        <h4>

        <label for="sslc">Upload SSLC Certificate:</label>
        <input type="file" id="sslc" name="sslc" size="50" /><br /><br />

        <label for="puc">Upload 2nd PUC Certificate:</label>
        <input type="file" id="puc" name="puc" size="50" /><br /><br />

        <label for="caste">Upload Caste Certificate:</label>
        <input type="file" id="caste" name="caste" size="50" /><br /><br />

        <label for="tc">Upload Transfer Certificate:</label>
        <input type="file" id="tc" name="tc" size="50" /><br /><br />

        <label for="sports">Other activity Certificates:</label>
        <input type="file" id="sports" name="sports" multiple size="50" /><br /><br />

        <label for="letter"> Letter of Undertaking :</label>
        <input type="file" id="letter" name="letter" size="50" /><br /><br />

        <label>
          <input type="checkbox" name="agreement" required />
          I declare that the above information is true and accurate.
        </label><br />
      </fieldset>
      <br>
      <button type="submit">Submit Form</button>
      <button type="reset">Clear</button>
      </h4>
    </form>
  </body>
</html>
