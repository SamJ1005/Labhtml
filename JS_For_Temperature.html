<!DOCTYPE html>
<html>
  <head>
    <title>Temperature Converter</title>
  </head>
  <body>
    <h2>Temperature Converter program by Java Script</h2>
    <label>Enter Temperature:</label>
    <input type="number" id="tempInput" placeholder="Enter temperature value"/><br /><br />

    <label>Convert to:</label>
    <select id="conversionType">
      <option value="1">Celsius to Fahrenheit</option>
      <option value="2">Fahrenheit to Celsius</option>
    </select><br /><br />
    <button onclick="convertTemp()">Convert</button>
    <p id="result"></p>

    <script>
      function convertTemp() {
        let temperature = parseFloat(document.getElementById("tempInput").value);
        let choice = document.getElementById("conversionType").value;
        let result = "";

        if (isNaN(temperature)) {
          result = "Please enter a valid number.";
        } else if (choice === "1") {
          let fahrenheit = (temperature * 9) / 5 + 32;
          result = temperature + "°C is " + fahrenheit.toFixed(2) + "°F";
        } else if (choice === "2") {
          let celsius = ((temperature - 32) * 5) / 9;
          result = temperature + "°F is " + celsius.toFixed(2) + "°C";
        } else {
          result = "Invalid conversion choice.";
        }
        document.getElementById("result").innerText = result;
      }
    </script>
  </body>
</html>
