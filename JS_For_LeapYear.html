<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>JS For Leap Year</title>
    <style>
      body {
        background-color: #c8abdb;
        font-family: rockwell;
        font-size: 20px;
      }

      p {
        text-align: center;
      }

      h2 {
        text-align: center;
        font-size: 20px;
        font-family: georgia;
      }

      input[type="number"] {
        font-family: lucida sans typewriter;
        font-size: large;
        margin-left: 10px; /* add some padding to the left */
      }

      button {
        font-family: ms reference sans serif;
        font-size: large;
        margin-left: 10px; /* add some padding to the left */
      }
    </style>
  </head>
  <body>
    <h2>JAVA SCRIPT TO CHECK IF LEAP YEAR OR NOT</h2>
    <div style="text-align:center;">
      <input type="number" id="year" placeholder="Enter a year" />
      <button onclick="checkLeapYear()">Check Leap Year</button>
    </div>
    <p id="result"></p>

    <script>
      function checkLeapYear() {
        var year = parseInt(document.getElementById("year").value);
        if (isNaN(year)) {
          document.getElementById("result").innerHTML =
            "Invalid input. Please enter a valid number.";
          return;
        }
        var isLeapYear =
          (year % 4 === 0 && year % 100 !== 0) || year % 400 === 0;
        if (isLeapYear) {
          document.getElementById("result").innerHTML = "YES it is a Leap Year.";
        } else {
          document.getElementById("result").innerHTML = "No, it is NOT a Leap Year.";
        }
      }
    </script>
  </body>
</html>
